version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Matches min-release-age in .npmrc: wait a week before proposing a new release.
    cooldown:
      default-days: 7
    # Minor and patch updates arrive as one weekly pull request; majors stay separate.
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  # Keeps the SHA-pinned actions in .github/workflows current. The pinned
  # Gitleaks release is updated by hand: see scripts/secret-scan.mjs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
