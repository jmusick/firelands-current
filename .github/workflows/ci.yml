# Checks for every pull request and every push to main, built from the shared workflows in jmusick/ci
# (README "Continuous integration"). Dependabot proposes newer jmusick/ci releases through the pins below.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  baseline:
    name: Baseline
    uses: jmusick/ci/.github/workflows/baseline.yml@a8ac9c292577382c63e5a38af58d38a4cd6f8504 # v0.3.0
    with:
      # Same threshold as `npm run audit`.
      audit-level: moderate
      # Exceptions live only in .gitleaks.toml, as in the Git hooks (README "Secret scanning").
      ignore-gitleaks-allow: true

  web-app:
    name: Web app
    uses: jmusick/ci/.github/workflows/web-app.yml@a8ac9c292577382c63e5a38af58d38a4cd6f8504 # v0.3.0
    with:
      # worker-configuration.d.ts is generated rather than committed, and the secret-scan tests skip
      # their blocking cases unless the pinned Gitleaks is installed.
      setup-command: |
        npm run cf:types
        npm run secrets:install
      typecheck-command: npm run check
      test-command: npm test
      build-command: npm run build

  # The one check to require on main: it passes only when every job above passed.
  gate:
    name: CI gate
    if: always()
    needs: [baseline, web-app]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
