# Scans the full Git history for committed secrets on every pull request and
# every push to main, using the same pinned, checksum-verified Gitleaks as the
# local hooks (scripts/secret-scan.mjs).
#
# This workflow does not gate deployment by itself: Cloudflare Workers Builds
# deploys every push to main independently of GitHub Actions. To make the check
# binding, require the "Secret scan" status check on main with branch
# protection or a ruleset (see "Secret scanning" in README.md).
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every action is pinned to a commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, not a shallow clone
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Downloads the pinned release and verifies its SHA-256 before running it.
      - name: Install Gitleaks
        run: node scripts/secret-scan.mjs install

      # Redacted terminal output only; no report file is written.
      - name: Scan history
        run: node scripts/secret-scan.mjs history

      - name: Test the hooks and the fail-closed paths
        run: node --test scripts/test-secret-scan.mjs
