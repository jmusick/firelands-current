# Reviews dependency changes on every pull request and checks that every
# installed package carries a valid npm registry signature, on pull requests
# and on every push to main.
#
# Like the secret scan, this cannot stop a deploy by itself: Cloudflare Workers
# Builds deploys every push to main without waiting for GitHub Actions, and
# main has no ruleset (an accepted risk; see "Dependency review" in README.md).
# A failure here on main means the commit is already live and needs a fix.
name: Dependency review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Every action is pinned to a commit SHA; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fails when the pull request adds a runtime dependency with a known
      # advisory of moderate severity or worse (the level `npm run audit` uses).
      # Build-time tooling is reported but does not fail the check.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime
          license-check: false
          comment-summary-in-pr: never

  signatures:
    name: Registry signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Installs exactly what package-lock.json pins, without running any
      # package's install scripts, so nothing unverified executes here.
      - name: Install from the lockfile
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Fails if a package's registry signature is missing or invalid, or if a
      # provenance attestation it publishes does not verify.
      - name: Verify signatures and attestations
        run: npm audit signatures
